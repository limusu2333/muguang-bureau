model_list:
  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_base: os.environ/XJ_OPENAI_API_BASE
      api_key: os.environ/XJ_OPENAI_API_KEY
  - model_name: qwen3.8-max
    litellm_params:
      model: openai/qwen3.8-max
      api_base: os.environ/XJ_QWEN_API_BASE
      api_key: os.environ/XJ_QWEN_API_KEY
  - model_name: glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: os.environ/XJ_GLM_API_BASE
      api_key: os.environ/XJ_GLM_API_KEY
  - model_name: deepseek-v4-pro-0813
    litellm_params:
      model: openai/deepseek-v4-pro-0813
      api_base: os.environ/XJ_DEEPSEEK_API_BASE
      api_key: os.environ/XJ_DEEPSEEK_API_KEY

litellm_settings:
  drop_params: false
  telemetry: false
  json_logs: true

general_settings:
  allow_requests_on_db_unavailable: false
  store_model_in_db: false
