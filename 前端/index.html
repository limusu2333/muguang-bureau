<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>开发公司 · 船主的窗户</title>
    <script>
      try {
        document.documentElement.dataset.prebootTheme =
          localStorage.getItem('xj_visual_theme') === 'mist' ? 'mist' : 'deep-space'
      } catch {
        document.documentElement.dataset.prebootTheme = 'deep-space'
      }
    </script>
    <style>
      #preboot {
        --boot-bg: linear-gradient(112deg, #07090d, #111621 56%, #090b10);
        --boot-ink: rgba(241, 244, 248, .92);
        --boot-meta: rgba(207, 216, 229, .46);
        --boot-line: rgba(172, 194, 226, .82);
        position: fixed;
        inset: 0;
        z-index: 160;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: var(--boot-bg);
        color: var(--boot-ink);
        opacity: 1;
        transition: opacity .18s ease;
      }
      html[data-preboot-theme="mist"] #preboot {
        --boot-bg: radial-gradient(circle at 68% 42%, rgba(255,255,255,.72), transparent 38%), linear-gradient(112deg, #cdd9e2, #eff3f6 56%, #d9e3ea);
        --boot-ink: rgba(45, 59, 72, .88);
        --boot-meta: rgba(63, 80, 96, .45);
        --boot-line: rgba(255, 255, 255, .94);
      }
      #preboot.handoff { opacity: 0; pointer-events: none; }
      .preboot-copy {
        display: grid;
        width: min(260px, 62vw);
        justify-items: center;
        gap: 12px;
        text-align: center;
      }
      .preboot-copy span {
        font-family: Georgia, "Times New Roman", serif;
        font-size: 17px;
        font-weight: 400;
        letter-spacing: .34em;
      }
      .preboot-copy small {
        font: 400 9px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
        letter-spacing: .3em;
        color: var(--boot-meta);
      }
      .preboot-line {
        position: relative;
        display: block;
        width: 100%;
        height: 1px;
        overflow: hidden;
        background: color-mix(in srgb, var(--boot-meta) 34%, transparent);
      }
      .preboot-line::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 34%;
        background: var(--boot-line);
        transform: translateX(-110%);
        animation: preboot-progress 1.35s cubic-bezier(.65, 0, .35, 1) infinite;
      }
      @keyframes preboot-progress {
        0% { transform: translateX(-110%); }
        58%, 100% { transform: translateX(300%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #preboot { transition-duration: .08s; }
        .preboot-line::after { animation: none; transform: translateX(98%); }
      }
    </style>
  </head>
  <body>
    <div id="preboot" aria-hidden="true">
      <div class="preboot-copy">
        <span>MUNAEA</span>
        <i class="preboot-line"></i>
        <small>船主的窗户</small>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
