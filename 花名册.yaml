# 班子层级说明：
# 船主：示例主人，最终拍板者，不作为可调用模型岗位。
# 项目经理：拆解、审批、整合、守边界。
# 首席工程师：最难的核心工程判断与代码。
# 工程师：接口、通道、工程落地。
# 文案工程师（兼职）：文档、公告、归档、事实校对。
# 测试工程师：独立验证、反证、回归。

